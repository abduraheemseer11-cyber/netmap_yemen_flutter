name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Secrets required (Settings > Secrets and variables > Actions):
      #   GOOGLE_SERVICES_JSON = base64 of google-services.json (from Firebase console)
      #   MAPS_API_KEY         = Google Maps Android API key
      - name: Generate android/ and iOS folders (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name netmap_yemen --org com.netmap --platforms=android,ios
            rm -rf test   # default widget test references the template app and would fail analysis
          fi

      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is missing. Add it (base64 of google-services.json) in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Patch Android project (Firebase, Maps, permissions, minSdk)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, sys

          def read(path):
              p = pathlib.Path(path)
              if not p.exists():
                  sys.exit(f"::error::{path} not found (unexpected Flutter template)")
              return p, p.read_text()

          # 1) Register the Google Services plugin
          p, s = read("android/settings.gradle.kts")
          if "com.google.gms.google-services" not in s:
              s = re.sub(r'(id\("dev\.flutter\.flutter-plugin-loader"\) version "[^"]+")',
                         r'\1\n    id("com.google.gms.google-services") version "4.4.2" apply false', s, count=1)
          p.write_text(s)

          # 2) Apply it in the app module, set minSdk 23, align applicationId with Firebase
          p, s = read("android/app/build.gradle.kts")
          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace('id("dev.flutter.flutter-gradle-plugin")',
                            'id("dev.flutter.flutter-gradle-plugin")\n    id("com.google.gms.google-services")', 1)
          s = re.sub(r'minSdk\s*=\s*[^\n]+', 'minSdk = 23', s)
          gs = json.load(open("android/app/google-services.json"))
          pkg = gs["client"][0]["client_info"]["android_client_info"]["package_name"]
          s = re.sub(r'applicationId\s*=\s*"[^"]*"', f'applicationId = "{pkg}"', s)
          p.write_text(s)
          print("applicationId =", pkg)

          # 3) Manifest: permissions + Google Maps API key
          p, s = read("android/app/src/main/AndroidManifest.xml")
          perms = ('<uses-permission android:name="android.permission.INTERNET"/>\n'
                   '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
                   '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    ')
          if "ACCESS_FINE_LOCATION" not in s:
              s = s.replace("<application", perms + "<application", 1)
          key = os.environ.get("MAPS_API_KEY", "")
          if not key:
              print("::warning::MAPS_API_KEY secret is empty - the map will be blank.")
          meta = f'\n        <meta-data android:name="com.google.android.geo.API_KEY" android:value="{key}"/>'
          if "com.google.android.geo.API_KEY" not in s:
              s = re.sub(r'(<application[^>]*>)', lambda m: m.group(1) + meta, s, count=1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Analyze (informational)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: netmap-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true

name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]          # e.g. git tag v1.0.0 && git push --tags  -> creates a GitHub Release
  pull_request:
    branches: [main]
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write          # needed to attach the APK to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify android/ folder exists
        run: |
          if [ ! -d android ]; then
            echo "::error::android/ folder not found. Run 'flutter create .' and 'flutterfire configure' locally, then commit android/."
            exit 1
          fi

      # --- Secrets (Settings > Secrets and variables > Actions) ---
      # GOOGLE_SERVICES_JSON : base64 of android/app/google-services.json   (base64 -w0 google-services.json)
      # MAPS_API_KEY         : your Google Maps Android API key
      - name: Inject Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set (using committed file if present)."
          fi

      - name: Inject Google Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then
            sed -i "s/YOUR_MAPS_KEY/${MAPS_API_KEY}/g" android/app/src/main/AndroidManifest.xml
          else
            echo "::warning::MAPS_API_KEY secret not set - the map will be blank."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK (per-ABI + universal)
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: netmap-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true

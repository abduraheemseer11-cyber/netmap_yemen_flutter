name: netmap_yemen
description: Offline-first satellite GIS app for network technicians (Arabic default).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  provider: ^6.1.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  uuid: ^4.5.1
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# ---------------- App icon configuration ----------------
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"       # 1024x1024, opaque (legacy + iOS)
  android: "launcher_icon"
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"           # background layer
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"  # transparent, padded to safe zone
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
